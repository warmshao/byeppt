<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1D1713"/>
      <stop offset="1" stop-color="#100D0B"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#sheen)"/>

  <!-- two slides mid-flip -->
  <g transform="translate(512 512) scale(1.3) translate(-512 -512)">
    <g transform="rotate(-12 448 460)">
      <rect x="198" y="302" width="500" height="315" rx="44" fill="#100D0B" stroke="#F2501F" stroke-width="52"/>
    </g>
    <g transform="rotate(9 580 570)">
      <rect x="330" y="412" width="500" height="315" rx="44" fill="#100D0B" stroke="#F6C4B2" stroke-width="52"/>
    </g>
  </g>
</svg>
