<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#E8452F"/>
      <stop offset="1" stop-color="#D2331D"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.14" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="planeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6B1508" flood-opacity="0.35"/>
    </filter>
    <g id="lettP" fill="none" stroke="#D63A1E" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 13 68 V 13 H 40 A 19 19 0 0 1 40 51 H 13"/>
    </g>
    <g id="lettT" fill="none" stroke="#D63A1E" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 13 H 52 M 26 13 V 68"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#sheen)"/>

  <!-- flight trail -->
  <g fill="#FFFFFF">
    <rect x="338" y="576" width="72" height="24" rx="12" transform="rotate(-38 374 588)" opacity="0.65"/>
    <rect x="262" y="642" width="58" height="21" rx="10.5" transform="rotate(-38 291 652)" opacity="0.48"/>
    <rect x="198" y="700" width="46" height="18" rx="9" transform="rotate(-38 221 709)" opacity="0.32"/>
  </g>

  <!-- the PPT paper plane flying away: bye! -->
  <g transform="translate(522 468) rotate(-38) scale(1.9)" filter="url(#planeShadow)">
    <polygon points="130,0 -100,-110 -30,0 -100,110" fill="#FFFFFF"/>
    <polygon points="130,0 -30,0 -100,110" fill="#F3CFC6"/>
    <g transform="translate(-58 -25) scale(0.62)">
      <use href="#lettP"/>
      <use href="#lettP" transform="translate(72 0)"/>
      <use href="#lettT" transform="translate(144 0)"/>
    </g>
  </g>
</svg>
