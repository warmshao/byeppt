[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byeppt-pptx-py"
version = "0.1.0"
description = "ppt-master deterministic PPTX tooling (SVG->PPTX, quality gates) packaged for byeppt/vsurf"
requires-python = ">=3.10"
dependencies = [
  "python-pptx",
  "XlsxWriter>=3.0.0",
  "Pillow",
  "skia-pathops",
  "uharfbuzz",
  "numpy",
  "requests",
  "google-genai",
  "beautifulsoup4",
  "lxml",
  "pdfplumber>=0.11.0",
  "pypdfium2>=4.30.0",
  "mammoth>=1.6.0",
  "markdownify>=0.11.6",
  "openpyxl>=3.1.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
byeppt_pptx_py = ["**/*"]
