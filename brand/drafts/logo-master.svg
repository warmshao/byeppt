<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- brand gradient: warm coral-orange, matches app accent family -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9046"/>
      <stop offset="0.52" stop-color="#F2591F"/>
      <stop offset="1" stop-color="#D63F12"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.14" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2591F"/>
      <stop offset="1" stop-color="#D63F12"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7A1E05" flood-opacity="0.35"/>
    </filter>
    <filter id="sparkGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 4-point AI sparkle -->
    <path id="spark" d="M 0 -100 C 7 -32 32 -7 100 0 C 32 7 7 32 0 100 C -7 32 -32 7 -100 0 C -32 -7 -7 -32 0 -100 Z"/>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#sheen)"/>

  <!-- deck: back card peeking out -->
  <g transform="rotate(-7 512 548)">
    <rect x="162" y="330" width="620" height="349" rx="56" fill="#FFFFFF" opacity="0.38"/>
  </g>

  <!-- front slide card -->
  <g transform="rotate(-7 512 572)">
    <rect x="202" y="397" width="620" height="349" rx="56" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <!-- the 'bye' wave -->
    <path d="M 312 596 C 352 506 422 506 462 596 C 502 686 572 686 612 596 C 652 506 722 506 762 596"
          fill="none" stroke="url(#wave)" stroke-width="46" stroke-linecap="round"/>
  </g>

  <!-- AI sparkles -->
  <g filter="url(#sparkGlow)">
    <use href="#spark" transform="translate(800 306) scale(0.78)" fill="#FFFFFF"/>
    <use href="#spark" transform="translate(682 212) scale(0.30)" fill="#FFFFFF" opacity="0.9"/>
    <use href="#spark" transform="translate(872 418) scale(0.24)" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
