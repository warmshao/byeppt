<svg xmlns="http://www.w3.org/2000/svg" width="872" height="606" viewBox="76 213 872 606">
  <defs>
    <!-- knock the front frame out of the back one (with a small air gap) -->
    <mask id="cut">
      <rect x="76" y="213" width="872" height="606" fill="#FFFFFF"/>
      <g transform="rotate(9 580 570)">
        <rect x="330" y="412" width="500" height="315" rx="44" fill="none" stroke="#000000" stroke-width="66"/>
      </g>
    </mask>
  </defs>
  <!-- two slides mid-flip, monochrome (inherits currentColor) -->
  <g transform="translate(512 512) scale(1.3) translate(-512 -512)">
    <g mask="url(#cut)">
      <g transform="rotate(-12 448 460)">
        <rect x="198" y="302" width="500" height="315" rx="44" fill="none" stroke="currentColor" stroke-width="52"/>
      </g>
    </g>
    <g transform="rotate(9 580 570)">
      <rect x="330" y="412" width="500" height="315" rx="44" fill="none" stroke="currentColor" stroke-width="52"/>
    </g>
  </g>
</svg>
