<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="852" viewBox="0 84 1024 852">
  <defs>
    <!-- knock the front frame out of the back one (with a small air gap) -->
    <mask id="cut">
      <rect x="0" y="84" width="1024" height="852" fill="#FFFFFF"/>
      <g transform="rotate(8 580 570)">
        <rect x="330" y="412" width="500" height="315" rx="44" fill="none" stroke="#000000" stroke-width="92"/>
      </g>
    </mask>
  </defs>
  <!-- two slides mid-flip, small-size geometry: brand orange back frame,
       theme-ink front frame (currentColor) -->
  <g transform="translate(512 512) scale(1.42) translate(-512 -512)">
    <g mask="url(#cut)">
      <g transform="rotate(-10 448 460)">
        <rect x="198" y="302" width="500" height="315" rx="44" fill="none" stroke="#F2501F" stroke-width="76"/>
      </g>
    </g>
    <g transform="rotate(8 580 570)">
      <rect x="330" y="412" width="500" height="315" rx="44" fill="none" stroke="currentColor" stroke-width="76"/>
    </g>
  </g>
</svg>
