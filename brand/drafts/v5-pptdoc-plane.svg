<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#E8452F"/>
      <stop offset="1" stop-color="#D2331D"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.14" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C22E17"/>
      <stop offset="1" stop-color="#A82410"/>
    </linearGradient>
    <filter id="docShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#6B1508" flood-opacity="0.4"/>
    </filter>
    <filter id="tabShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6B1508" flood-opacity="0.35"/>
    </filter>
    <filter id="planeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6B1508" flood-opacity="0.3"/>
    </filter>
    <!-- bold rounded letterforms (stroke-based, no font dependency) -->
    <g id="lettP" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 13 68 V 13 H 40 A 19 19 0 0 1 40 51 H 13"/>
    </g>
    <g id="lettT" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 13 H 52 M 26 13 V 68"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#sheen)"/>

  <g transform="translate(0 -28)">
  <!-- tilted PPT document -->
  <g transform="rotate(-10 470 630)">
    <g filter="url(#docShadow)">
      <!-- page with folded corner -->
      <path d="M 270 330 H 606 L 700 424 V 896 A 30 30 0 0 1 670 926 H 270 A 30 30 0 0 1 240 896 V 360 A 30 30 0 0 1 270 330 Z"
            fill="#FFFFFF"/>
      <path d="M 606 330 L 700 424 H 636 A 30 30 0 0 1 606 394 Z" fill="#EBD9D4"/>
      <!-- text lines -->
      <rect x="300" y="580" width="340" height="22" rx="11" fill="#D63A1E" opacity="0.35"/>
      <rect x="300" y="636" width="340" height="22" rx="11" fill="#D63A1E" opacity="0.25"/>
      <rect x="300" y="692" width="340" height="22" rx="11" fill="#D63A1E" opacity="0.25"/>
      <rect x="300" y="748" width="250" height="22" rx="11" fill="#D63A1E" opacity="0.18"/>
      <!-- red PPT tab -->
      <g filter="url(#tabShadow)">
        <rect x="182" y="392" width="372" height="132" rx="28" fill="url(#tab)"/>
        <use href="#lettP" transform="translate(240 424)"/>
        <use href="#lettP" transform="translate(322 424)"/>
        <use href="#lettT" transform="translate(404 424)"/>
      </g>
    </g>
  </g>

  <!-- curved flight trail -->
  <g fill="#FFFFFF">
    <rect x="660" y="354" width="50" height="20" rx="10" transform="rotate(-58 685 364)" opacity="0.38"/>
    <rect x="728" y="296" width="42" height="17" rx="8.5" transform="rotate(-44 749 304)" opacity="0.58"/>
    <rect x="784" y="246" width="34" height="14" rx="7" transform="rotate(-30 801 253)" opacity="0.78"/>
  </g>

  <!-- paper plane flying away: bye! -->
  <g transform="translate(830 210) rotate(-38) scale(1.0)" filter="url(#planeShadow)">
    <polygon points="130,0 -90,-78 -38,0 -90,78" fill="#FFFFFF"/>
    <polygon points="130,0 -38,0 -90,78" fill="#F3CFC6"/>
    <line x1="130" y1="0" x2="-38" y2="0" stroke="#D63A1E" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  </g>
  </g>
</svg>
