<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="788" viewBox="7 115 1010 788">
  <defs>
    <!-- knock the front frame out of the back one (with a small air gap) -->
    <mask id="cut">
      <rect x="7" y="115" width="1010" height="788" fill="#FFFFFF"/>
      <g transform="rotate(9 580 570)">
        <rect x="330" y="412" width="500" height="315" rx="44" fill="none" stroke="#000000" stroke-width="66"/>
      </g>
    </mask>
  </defs>
  <!-- two slides mid-flip (transparent background) -->
  <g transform="translate(512 512) scale(1.3) translate(-512 -512)">
    <g mask="url(#cut)">
      <g transform="rotate(-12 448 460)">
        <rect x="198" y="302" width="500" height="315" rx="44" fill="none" stroke="#F2501F" stroke-width="52"/>
      </g>
    </g>
    <g transform="rotate(9 580 570)">
      <rect x="330" y="412" width="500" height="315" rx="44" fill="none" stroke="#F6C4B2" stroke-width="52"/>
    </g>
  </g>
</svg>
