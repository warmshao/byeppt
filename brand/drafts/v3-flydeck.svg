<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#E8452F"/>
      <stop offset="1" stop-color="#D2331D"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.14" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0452B"/>
      <stop offset="1" stop-color="#C22E17"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6B1508" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#sheen)"/>

  <!-- deck flying away up-right, waving bye -->
  <g transform="rotate(14 512 540)">
    <rect x="152" y="462" width="560" height="315" rx="50" fill="#FFFFFF" opacity="0.30" transform="translate(-104 74)"/>
    <rect x="152" y="462" width="560" height="315" rx="50" fill="#FFFFFF" opacity="0.55" transform="translate(-52 37)"/>
    <g filter="url(#cardShadow)">
      <rect x="152" y="462" width="560" height="315" rx="50" fill="#FFFFFF"/>
      <path d="M 262 620 C 296 544 356 544 390 620 C 424 696 484 696 518 620 C 552 544 612 544 646 620"
            fill="none" stroke="url(#wave)" stroke-width="42" stroke-linecap="round"/>
    </g>
  </g>

  <!-- motion dashes -->
  <g fill="#FFFFFF">
    <rect x="180" y="742" width="110" height="22" rx="11" transform="rotate(14 235 753)" opacity="0.5"/>
    <rect x="236" y="800" width="70" height="18" rx="9" transform="rotate(14 271 809)" opacity="0.32"/>
  </g>
</svg>
