<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#E8452F"/>
      <stop offset="1" stop-color="#D2331D"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.14" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#6B1508" flood-opacity="0.38"/>
    </filter>
    <filter id="planeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6B1508" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#sheen)"/>

  <!-- the slide it took off from -->
  <g transform="rotate(-8 400 640)" filter="url(#cardShadow)">
    <rect x="150" y="500" width="500" height="281" rx="46" fill="#FFFFFF"/>
    <rect x="212" y="566" width="190" height="30" rx="15" fill="#D63A1E"/>
    <rect x="212" y="628" width="300" height="22" rx="11" fill="#D63A1E" opacity="0.42"/>
    <rect x="212" y="678" width="248" height="22" rx="11" fill="#D63A1E" opacity="0.28"/>
  </g>

  <!-- flight trail -->
  <g fill="#FFFFFF">
    <rect x="596" y="452" width="52" height="20" rx="10" transform="rotate(-52 622 462)" opacity="0.35"/>
    <rect x="664" y="398" width="44" height="17" rx="8.5" transform="rotate(-52 686 406)" opacity="0.55"/>
    <rect x="724" y="348" width="36" height="14" rx="7" transform="rotate(-52 742 355)" opacity="0.75"/>
  </g>

  <!-- paper plane flying away: bye! -->
  <g transform="translate(812 268) rotate(-38) scale(1.05)" filter="url(#planeShadow)">
    <polygon points="130,0 -90,-78 -38,0 -90,78" fill="#FFFFFF"/>
    <polygon points="130,0 -38,0 -90,78" fill="#F3CFC6"/>
    <line x1="130" y1="0" x2="-38" y2="0" stroke="#D63A1E" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
